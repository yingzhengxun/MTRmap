// Stonecutter 分支脚本：forge 版本节点（1.20.1）执行一次。
plugins {
    id "dev.architectury.loom"
    id "architectury-plugin"
    id "com.github.johnrengelman.shadow"
}

def sc = stonecutter
def mc = sc.current.version
def loader = findProperty("loom.platform")
def modVersion = rootProject.property("mod.version")
def commonProject = sc.node.sibling("").project
// MC 1.21.1 要求 Java 21，1.20.1 用 17
def mcMinor = mc.split("\\.")[1] as int
def javaVersion = mcMinor >= 21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
def javaRelease = mcMinor >= 21 ? 21 : 17

version = modVersion
base {
    archivesName = "${rootProject.property("mod.id")}-${loader}"
}

architectury {
    platformSetupLoomIde()
    forge()
}

// 见根 build.gradle：固定 refmap 文件名，供 mtrmap.mixins.json 引用
loom {
    mixin {
        defaultRefmapName = "mtrmap-forge-refmap.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings loom.officialMojangMappings()

    forge "net.minecraftforge:forge:${commonProject.property("deps.forge_loader")}"

    // 与 common 同源的 MTR Forge 分支产物
    modImplementation rootProject.files("libs/${commonProject.property("deps.mtr_forge_jar")}")

    common(project(path: commonProject.path, configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: commonProject.path, configuration: "transformProductionForge")) { transitive false }
}

// Forge 版本号形如 "1.20.1-47.4.23"：前半段是 MC 版本，后半段是 Forge 自身版本。
// 注意区分两个东西：
//  - forgeModVersion：Forge 作为普通 mod 的版本，"47.4.23"，用于 [[dependencies]] 的 versionRange；
//  - fmlLoaderVersion：FML 语言提供者 javafml 的版本，只有主版本号 "47"，
//    用于 loaderVersion。若把完整的 47.4.23 填进 loaderVersion，启动会直接报
//    "needs language provider javafml:47.4.23 or above to load. We have found 47"。
def forgeModVersion = commonProject.property("deps.forge_loader").toString().split("-").last()
def fmlLoaderVersion = forgeModVersion.split("\\.")[0]

processResources {
    def props = [
            version  : modVersion,
            id       : rootProject.property("mod.id"),
            name     : rootProject.property("mod.name"),
            minecraft: commonProject.property("mod.mc_dep_forgelike"),
            mtr      : commonProject.property("mod.mtr_dep"),
            xaero    : rootProject.property("mod.xaero_dep"),
            forge    : forgeModVersion,
            fml      : fmlLoaderVersion
    ]
    inputs.properties props
    filesMatching("META-INF/mods.toml") {
        expand props
    }
    // compatibilityLevel 与根脚本里的 mtrmap.mixins.json 保持一致
    def mixinCompat = "JAVA_17"
    inputs.property "compatibilityLevel", mixinCompat
}

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaRelease
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    // Forge 1.20.1 不认 mods.toml 里的 [[mixins]]（那是 NeoForge 的写法，所以 neoforge 分支没这问题），
    // 它只从 jar MANIFEST 的 MixinConfigs 属性里读 mixin 配置（见 MTR 自己的 forge jar）。
    // 不写这个属性，mixin 配置根本不会被注册，铁路仪表板的"交通线路图"按钮就不会出现。
    manifest {
        attributes "MixinConfigs": "mtrmap.mixins.json"
    }

    // common 的 refmap 名字带 MC 版本号（mtrmap-common-1.20.1-refmap.json），
    // 而 mtrmap.mixins.json 里的 "refmap" 只能写死一个固定名字，否则 Forge 下注入静默失败。
    // common 的产物是通过 configurations 合并进来的，这类条目不走 rename/eachFile，
    // 所以这里用 zipTree 手工再放一份改好名的。
    from(project.provider { zipTree(project.configurations.shadowCommon.singleFile) }) {
        include "mtrmap-common-*-refmap.json"
        rename "mtrmap-common-.*-refmap\\.json", "mtrmap-common-refmap.json"
    }

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

tasks.build {
    group = "versioned"
    description = "Must run through 'chiseledBuild'"
}

tasks.register("buildAndCollect", Copy) {
    group = "versioned"
    dependsOn tasks.named("build")
    from(tasks.named("remapJar"))
    into(rootProject.layout.buildDirectory.dir("libs/${modVersion}/${mc}/${loader}"))
}
