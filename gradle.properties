# Increase the memory available to Gradle (Forge userdev / remapping is memory hungry).
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Mod properties
mod.version=2.3.5
mod.group=com.mtrmap
mod.id=mtrmap
mod.name=MTR Map

# 底图取自 Xaero 的世界地图，因此它是硬前置。各 MC 版本的 mod id 都是 xaeroworldmap，
# 且 1.20.1 / 1.21.1 都在 1.46.0 上，用通配符即可。
mod.xaero_dep=*

# Fabric loader 与 MC 版本无关，各版本共用
deps.fabric_loader=0.15.11

# 以下各项必须由 versions/<mc>/gradle.properties 提供
deps.fabric_api=[VERSIONED]
deps.forge_loader=[VERSIONED]
deps.neoforge_loader=[VERSIONED]
deps.mtr_fabric_jar=[VERSIONED]
deps.mtr_forge_jar=[VERSIONED]
deps.mtr_neoforge_jar=[VERSIONED]

# 写入 mod 元数据的依赖范围
mod.platforms=[VERSIONED]
mod.mc_dep_fabric=[VERSIONED]
mod.mc_dep_forgelike=[VERSIONED]
mod.mtr_dep=[VERSIONED]
